<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratory medicine · Health equity module preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:15px system-ui,sans-serif}.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:white;border-bottom:1px solid #d3e0e6;flex-wrap:wrap}.bar strong{margin-right:auto}button{background:#0f655f;color:white;border:0;border-radius:6px;padding:10px 14px;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #c48513;outline-offset:2px}#menu{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;background:#eaf2f5}#menu button{background:white;color:#173749;border:1px solid #c5d2db;text-align:left}#menu button[aria-current=true]{background:#0f655f;color:white}iframe{display:block;width:100%;height:calc(100vh - 120px);border:0;background:#f4f7fa}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;background:white;border-top:1px solid #d3e0e6}[hidden]{display:none!important}small{color:#526879}@media(max-width:600px){iframe{height:calc(100vh - 160px)}.bar{padding:10px}.bottom{padding:10px}}</style><div class="bar"><strong>Laboratory Medicine, Health Equity, and Ethics <span style="font-size:12px;background:#fff0cf;color:#694b00;padding:4px 8px;border-radius:5px">Beta</span></strong><small>Educational beta · Under review</small><small id="visited"></small><button id="toggle" type="button">Sections</button></div><nav id="menu" hidden aria-label="Module sections"></nav><main id="frames"></main><footer class="bottom"><button id="previous">Previous section</button><span id="position"></span><button id="next">Next section</button></footer><script>const sections=[{"label":"Welcome","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Welcome · Health equity in laboratory medicine<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb}h1{font-size:clamp(28px,4vw,42px);line-height:1.15}h2{font-size:25px;line-height:1.3}main{max-width:920px;margin:24px auto;padding:0 20px 30px}.card{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:28px;margin:20px 0}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a7dcd1;font-weight:750}li{margin:10px 0}.note{border-left:4px solid #0f655f;padding-left:18px}small{font-size:14px;color:#526879}@media(max-width:600px){header{padding:28px 20px}.card{padding:20px}}<\/style><header><div class=\"eyebrow\">Welcome · Educational beta<\/div><h1>Health equity in laboratory medicine<\/h1><p>A case-based space for learning, analysis, and discussion among pathology residents and fellows.<\/p><\/header><main><section class=\"card\"><h2>Why this module?<\/h2><p>Laboratory testing shapes opportunities for diagnosis and care. This module explores how access, testing choices, reference populations, reporting, and data can relate to health and health care disparities.<\/p><p>The purpose is to deepen interpretation and invite questions—not to present a single correct implementation plan for every setting.<\/p><h2>Learning objectives<\/h2><p>By the end, learners should be better able to:<\/p><ul><li>Distinguish health disparities, health care disparities, health inequity, and social determinants of health.<\/li><li>Recognize how laboratory workflows and testing decisions can create or reinforce unequal opportunities for care.<\/li><li>Interpret case findings alongside published evidence, including what each does and does not establish.<\/li><li>Discuss how pathologists can help clinicians understand test utility, limitations, and the implications of laboratory data.<\/li><\/ul><\/section><section class=\"card\"><h2>About the author and AI assistance<\/h2><p>This module was developed by a clinical pathology resident exploring how laboratory medicine relates to health equity. It is a learning project intended to support critical analysis, discussion, and further inquiry. Feedback from learners and colleagues is welcome.<\/p><p>AI tools assisted with drafting, editing, organizing the material, and building the site. The content may contain errors or omissions; references are provided so readers can explore the evidence and evaluate the interpretations.<\/p><h2>Understanding the cases and evidence<\/h2><p>Cases, patients, local workflows, and numerical examples are fictional unless explicitly identified as published findings with a citation.<\/p><p>Explanations draw on studies, professional guidance, and conceptual sources. References support the accompanying claims, rather than every detail of a fictional scenario. Findings should be understood within the populations and settings studied.<\/p><p>Corresponding references appear in answer explanations and case evidence notes, with optional further reading at the end.<\/p><p class=\"note\">This educational beta does not replace current guidance or patient-specific professional judgment. Corrections, alternative interpretations, and thoughtful critique are welcome.<\/p><\/section><section class=\"card\"><h2>Using the module<\/h2><p>Choose an answer, reveal the explanation, and explore the evidence. There is no timer or passing score. The Sections menu lets you move between topics; answers remain while this page stays open and reset on refresh.<\/p><p><strong>Select “Begin module” below to start.<\/strong><\/p><small>Welcome and disclosure updated October 4, 2026.<\/small><\/section><\/main><\/html>"},{"label":"1 · Foundations","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Foundations preview<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 1 preview<\/div><h1>From health disparities<br>to health equity<\/h1><p>Explore what laboratory data reveal, what they leave out, and where pathologists can contribute.<\/p><\/header><main><nav class=\"tabs\" aria-label=\"Foundation beats\"><button type=\"button\" aria-current=\"true\">1. Observe<\/button><button type=\"button\" aria-current=\"false\">2. Define<\/button><button type=\"button\" aria-current=\"false\">3. Trace<\/button><button type=\"button\" aria-current=\"false\">4. Interpret<\/button><button type=\"button\" aria-current=\"false\">5. Contribute<\/button><\/nav><section class=\"panel\" id=\"beat0\" ><div class=\"eyebrow\">Beat 1 of 5<\/div><h2>What did we observe?<\/h2><p>During a laboratory quality review, your team examines completion of outpatient fecal immunochemical testing (FIT), a stool-based colorectal cancer screening test, after a kit is ordered.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Patient population<\/th><th>FIT completed<\/th><\/tr><tr><td>Patients living in neighborhoods with lower area-level socioeconomic deprivation<\/td><td>82%<\/td><\/tr><tr><td>Patients living in neighborhoods with higher area-level socioeconomic deprivation<\/td><td>64%<\/td><\/tr><\/table><\/div>\n<p><strong>Illustrative fictional data.<\/strong> The difference persists across several months.<\/p>\n<form class=\"question\" data-key=\"A\"><h3>Question 1<\/h3><p>Which interpretation is best supported by the FIT completion data?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" name=\"q1\" value=\"A\"><span><b>A<\/b> The groups differ in completion of a health care process; the data do not establish the cause or subsequent health outcomes.<\/span><\/label><label><input type=\"radio\" name=\"q1\" value=\"B\"><span><b>B<\/b> Patients in higher-deprivation neighborhoods are more likely to develop colorectal cancer.<\/span><\/label><label><input type=\"radio\" name=\"q1\" value=\"C\"><span><b>C<\/b> Patients in higher-deprivation neighborhoods have less opportunity to complete screening.<\/span><\/label><label><input type=\"radio\" name=\"q1\" value=\"D\"><span><b>D<\/b> The clinics serving higher-deprivation neighborhoods provide lower-quality care.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden><p class=\"verdict\"><\/p><p><strong>Best answer: A.<\/strong> The dashboard measures testing completion. It does not directly measure opportunity, explain the difference, or establish differences in cancer outcomes. These possibilities may matter, but they require additional information.\n<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.nimhd.nih.gov/about/what-are-health-disparities\" target=\"_blank\" rel=\"noopener\">NIMHD — What Are Health Disparities?<\/a><\/li><li><a href=\"https://www.who.int/health-topics/health-equity\" target=\"_blank\" rel=\"noopener\">WHO — Health equity<\/a><\/li><li><a href=\"https://www.who.int/news-room/fact-sheets/detail/social-determinants-of-health\" target=\"_blank\" rel=\"noopener\">WHO — Social determinants of health<\/a><\/li><\/ul><p><small>Conceptual sources support the interpretation; the FIT data and local observations are fictional teaching examples.<\/small><\/p><\/div><\/div><\/form><\/section><section class=\"panel\" id=\"beat1\" hidden><div class=\"eyebrow\">Beat 2 of 5<\/div><h2>Where does laboratory care fit?<\/h2><p>Health and health care disparities are documented across populations and settings. Laboratory medicine is part of the care pathway in which these disparities can arise: who is offered testing, whether collection and return are feasible, and how results are interpreted and followed up.<\/p>\n<p>The FIT dashboard gives us a starting point for understanding a difference in completion. Its importance does not depend on already knowing its full explanation. The central distinction is between identifying a pattern and understanding the processes that contribute to it.<\/p>\n<h3>Match the concept<\/h3>\n<p>Match each statement to <strong>health disparity<\/strong>, <strong>health care disparity<\/strong>, <strong>health inequity<\/strong>, or <strong>social determinants of health<\/strong>. The examples are illustrative, not findings from the FIT dashboard.<\/p>\n<form class=\"match\"><fieldset><legend>Match each statement to its main emphasis<\/legend><label for=\"match0\">Colorectal cancer mortality is higher in one population than another.<\/label><select id=\"match0\" required data-key=\"0\"><option value=\"\">Select a concept<\/option><option value=\"0\">Health disparity<\/option><option value=\"1\">Health care disparity<\/option><option value=\"2\">Health inequity<\/option><option value=\"3\">Social determinants of health<\/option><\/select><label for=\"match1\">Completion of follow-up colonoscopy after a positive FIT is lower in one population than another.<\/label><select id=\"match1\" required data-key=\"1\"><option value=\"\">Select a concept<\/option><option value=\"0\">Health disparity<\/option><option value=\"1\">Health care disparity<\/option><option value=\"2\">Health inequity<\/option><option value=\"3\">Social determinants of health<\/option><\/select><label for=\"match2\">An avoidable difference in health outcomes is understood to reflect unfair conditions.<\/label><select id=\"match2\" required data-key=\"2\"><option value=\"\">Select a concept<\/option><option value=\"0\">Health disparity<\/option><option value=\"1\">Health care disparity<\/option><option value=\"2\">Health inequity<\/option><option value=\"3\">Social determinants of health<\/option><\/select><label for=\"match3\">Housing, working conditions, and access to transportation shape opportunities for health and care.<\/label><select id=\"match3\" required data-key=\"3\"><option value=\"\">Select a concept<\/option><option value=\"0\">Health disparity<\/option><option value=\"1\">Health care disparity<\/option><option value=\"2\">Health inequity<\/option><option value=\"3\">Social determinants of health<\/option><\/select><\/fieldset><button type=\"submit\">Reveal matches<\/button><div class=\"match-feedback\" hidden><\/div><\/form>\n<p>These concepts overlap. Social conditions can contribute to differences in care and health outcomes, and some disparities reflect inequities. Definitions also vary across sources; the matches identify each statement&#x27;s main emphasis.<\/p>\n<p><strong>In the FIT case:<\/strong> Completion is a health care process. The dashboard does not directly measure cancer incidence or mortality. The gap deserves attention while its contributing processes remain uncertain.<\/p>\n<p><strong>Health care equity<\/strong> describes a fair opportunity to access, receive, and benefit from appropriate, high-quality care without unfair barriers.<\/p>\n<form class=\"question\" data-key=\"B\"><h3>Question 2<\/h3><p>Which additional finding would most strengthen the interpretation that the completion gap reflects a health care inequity?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" name=\"q2\" value=\"A\"><span><b>A<\/b> Both groups receive the same FIT kit and written instructions.<\/span><\/label><label><input type=\"radio\" name=\"q2\" value=\"B\"><span><b>B<\/b> Patients at lower-completion clinics report that specimen-return options are difficult to use or collection instructions are unclear, and workflow data link those barriers to incomplete testing.<\/span><\/label><label><input type=\"radio\" name=\"q2\" value=\"C\"><span><b>C<\/b> The gap remains similar when the dashboard is repeated the following year.<\/span><\/label><label><input type=\"radio\" name=\"q2\" value=\"D\"><span><b>D<\/b> FIT results have comparable analytical accuracy in both groups.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden><p class=\"verdict\"><\/p><p><strong>Best answer: B.<\/strong> It connects the completion gap to barriers in how collection and return are organized or communicated. Persistence alone does not explain the gap, identical materials do not establish equal access, and analytical accuracy does not describe who can complete testing. This finding strengthens an interpretation of inequity without proving that these barriers explain the entire difference. The concern is the fit between the service and patients&#x27; needs, rather than an assumed limitation of a population.\n<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.nimhd.nih.gov/about/what-are-health-disparities\" target=\"_blank\" rel=\"noopener\">NIMHD — What Are Health Disparities?<\/a><\/li><li><a href=\"https://www.who.int/health-topics/health-equity\" target=\"_blank\" rel=\"noopener\">WHO — Health equity<\/a><\/li><li><a href=\"https://www.who.int/news-room/fact-sheets/detail/social-determinants-of-health\" target=\"_blank\" rel=\"noopener\">WHO — Social determinants of health<\/a><\/li><\/ul><p><small>Conceptual sources support the interpretation; the FIT data and local observations are fictional teaching examples.<\/small><\/p><\/div><\/div><\/form>\n<details><summary>Evidence and definitions<\/summary><p>Conceptual sources: <a href=\"https://www.nimhd.nih.gov/about/what-are-health-disparities\" target=\"_blank\" rel=\"noopener\">NIMHD — What Are Health Disparities?<\/a> (2026), <a href=\"https://www.who.int/health-topics/health-equity\" target=\"_blank\" rel=\"noopener\">WHO — Health equity<\/a>, and <a href=\"https://www.who.int/news-room/fact-sheets/detail/social-determinants-of-health\" target=\"_blank\" rel=\"noopener\">WHO — Social determinants of health<\/a> (2025). The matching activity uses working distinctions for this lesson, rather than claiming that every source separates these terms identically. NIMHD also includes differences in care among its disparity measures.<\/p><\/details><\/section><section class=\"panel\" id=\"beat2\" hidden><div class=\"eyebrow\">Beat 3 of 5<\/div><h2>What happened before and after the specimen?<\/h2><p>A valid result depends on more than an assay working correctly. For FIT, a patient needs an opportunity to access screening, receive an offer or order, obtain a kit, collect and return a specimen, and receive appropriate interpretation and follow-up.<\/p>\n<p>Social determinants of health are the conditions in which people live, learn, work, and age, together with broader forces shaping those conditions. Structural determinants include institutional, economic, and policy arrangements shaping those opportunities.<\/p>\n<p>In this fictional case, clinic hours, collection instructions, return options, or missing outside-system testing are possible explanations. None has been demonstrated by the opening dashboard.<\/p>\n<details>\n<summary>What else can shape the diagnostic journey?<\/summary>\n<p>Relevant conditions may include insurance coverage and cost, preferred language and available language services, disability and accessibility, housing, working conditions and paid leave, caregiving, digital access, and availability of clinical services. Institutional policies and broader financing or eligibility rules can shape these conditions. Incarceration and immigration-related policies may also affect access and continuity of care.<\/p>\n<p>These are possible influences, not assumptions about an individual or explanations established by a demographic category. Their relevance depends on the patient, setting, and diagnostic pathway.<\/p>\n<\/details>\n<p><strong>Optional reflection:<\/strong> Where could a patient leave this pathway without ever appearing among the specimens received by the laboratory?<\/p>\n<p><strong>Discussion:<\/strong> Before an order, before obtaining a kit, or before specimen return. A dataset of received specimens cannot describe everyone who might have benefited from testing.<\/p><\/section><section class=\"panel\" id=\"beat3\" hidden><div class=\"eyebrow\">Beat 4 of 5<\/div><h2>What does the category leave out?<\/h2><p>The 64% completion rate describes a group, not every person in it. An area-level deprivation measure does not establish an individual patient&#x27;s income, circumstances, understanding, or behavior. People within the category may have very different experiences.<\/p>\n<form class=\"question\" data-key=\"A\"><h3>Question 3<\/h3><p>A patient&#x27;s address falls within the higher-deprivation category. What does the group completion rate establish about that patient?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" name=\"q3\" value=\"A\"><span><b>A<\/b> The group pattern provides context, but does not establish this patient&#x27;s circumstances.<\/span><\/label><label><input type=\"radio\" name=\"q3\" value=\"B\"><span><b>B<\/b> The patient faces the same barriers as most people in the category.<\/span><\/label><label><input type=\"radio\" name=\"q3\" value=\"C\"><span><b>C<\/b> The category has no useful role in understanding testing patterns.<\/span><\/label><label><input type=\"radio\" name=\"q3\" value=\"D\"><span><b>D<\/b> The patient probably cannot understand the collection instructions.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden><p class=\"verdict\"><\/p><p><strong>Best answer: A.<\/strong> Grouping can reveal patterns while leaving important individual and within-group variation unknown.\n<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.nimhd.nih.gov/about/what-are-health-disparities\" target=\"_blank\" rel=\"noopener\">NIMHD — What Are Health Disparities?<\/a><\/li><li><a href=\"https://www.who.int/health-topics/health-equity\" target=\"_blank\" rel=\"noopener\">WHO — Health equity<\/a><\/li><li><a href=\"https://www.who.int/news-room/fact-sheets/detail/social-determinants-of-health\" target=\"_blank\" rel=\"noopener\">WHO — Social determinants of health<\/a><\/li><\/ul><p><small>Conceptual sources support the interpretation; the FIT data and local observations are fictional teaching examples.<\/small><\/p><\/div><\/div><\/form><\/section><section class=\"panel\" id=\"beat4\" hidden><div class=\"eyebrow\">Beat 5 of 5<\/div><h2>What can the pathologist contribute?<\/h2><p>The laboratory can perform FIT accurately while some people never obtain or return a kit, or never receive follow-up after a result. Laboratory teams contribute knowledge about how testing is designed, performed, and reported. Their authority and opportunities to contribute vary by setting.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Relationship to the issue<\/th><th>Examples<\/th><\/tr><tr><td>Direct responsibility within the laboratory<\/td><td>Specimen acceptance criteria, assay performance, and reporting design<\/td><\/tr><tr><td>Influence through shared workflows<\/td><td>Collection instructions, specimen-return arrangements, and ordering pathways<\/td><\/tr><tr><td>Contribution through partnership<\/td><td>Discussions with clinical teams, patients, informatics colleagues, and community partners about access and follow-up<\/td><\/tr><\/table><\/div>\n<p>These roles can overlap. Collection instructions, for example, may be managed by the laboratory in one setting and jointly with clinical services in another.<\/p>\n<h3>Evidence across settings<\/h3>\n<p>Published findings can identify questions worth asking locally, but patient populations, resources, and workflows may differ between settings. External evidence can inform understanding without establishing that the same mechanism explains a local gap.<\/p>\n<p><strong>Closing reflection:<\/strong> In the FIT pathway, which part could your laboratory directly shape, and which would require collaboration?<\/p>\n<p><strong>Discussion:<\/strong> More than one response may be reasonable. The aim is to connect laboratory expertise with the relevant workflow and partners, rather than assign every access barrier to the laboratory.<\/p>\n<p>The later QI section develops how changes can improve overall performance while disparities persist.<\/p>\n<h3>Things to keep in mind<\/h3>\n<p class=\"item\"><strong>An observed disparity does not establish its cause.<\/strong> Identifying a pattern matters even while its contributing processes remain uncertain.<\/p>\n<p class=\"item\"><strong>A group average does not describe every individual.<\/strong> Circumstances vary within demographic and geographic categories.<\/p>\n<p class=\"item\"><strong>An accurate result is one part of diagnostic care.<\/strong> Access before testing and interpretation and follow-up afterward also shape its value.<\/p>\n<details><summary>Equity glossary<\/summary>\n<p><strong>Health disparity:<\/strong> A population difference in health status or outcomes, interpreted using the source&#x27;s definition; some definitions emphasize disadvantage and some include differences in care.<\/p>\n<p><strong>Health care disparity:<\/strong> A population difference in access to, use of, or quality of care, interpreted using the source&#x27;s definition and relevant context.<\/p>\n<p><strong>Health inequity:<\/strong> A difference understood as unfair or unjust; definitions often also emphasize avoidability or remediability.<\/p>\n<p><strong>Health equity:<\/strong> Fair opportunity to attain health and receive appropriate care without unfair barriers.<\/p>\n<p><strong>Social determinants of health:<\/strong> Conditions and broader forces shaping how people live and their opportunities for health.<\/p>\n<p><strong>Structural determinants:<\/strong> Broader institutional, economic, political, and social arrangements shaping social position and opportunities.<\/p><\/details><\/section><div class=\"nav\"><button id=\"back\" disabled>Previous beat<\/button><span id=\"position\">Beat 1 of 5<\/span><button id=\"next\">Next beat<\/button><\/div><p class=\"footer\">Review preview · Hypothetical FIT data · No timer or passing score · Progress lasts while this page stays open.<\/p><\/main><script>let current=0;const panels=[...document.querySelectorAll('.panel')],tabs=[...document.querySelectorAll('.tabs button')];function show(i){current=i;panels.forEach((p,n)=>p.hidden=n!==i);tabs.forEach((t,n)=>t.setAttribute('aria-current',n===i));document.querySelector('#back').disabled=i===0;document.querySelector('#next').disabled=i===4;document.querySelector('#position').textContent=`Beat ${i+1} of 5`;panels[i].querySelector('h2').focus();}tabs.forEach((t,i)=>t.onclick=()=>show(i));document.querySelector('#back').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelectorAll('h2').forEach(h=>h.tabIndex=-1);document.querySelectorAll('.question').forEach(f=>f.onsubmit=e=>{e.preventDefault();const choice=f.querySelector('input:checked');if(!choice){f.querySelector('input').focus();return;}const box=f.querySelector('.feedback');box.hidden=false;box.setAttribute('role','status');box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';});document.querySelector('.match').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,box=f.querySelector('.match-feedback');box.hidden=false;box.setAttribute('role','status');const terms=['Health disparity','Health care disparity','Health inequity','Social determinants of health'];const definitions=['A population difference in health status or outcomes.','A population difference in access to, use of, or quality of care.','A health difference understood as unfair or unjust.','Living conditions and broader forces shaping opportunities for health.'];box.innerHTML=[...f.querySelectorAll('select')].map((s,i)=>`<p><strong>${i+1}. ${terms[i]}<\/strong> — ${s.value==i?'Your match agrees.':'Review this distinction.'} ${definitions[i]}<\/p>`).join('');};<\/script><\/html>"},{"label":"2 · Diagnostic journey","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Diagnostic journey preview<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 2 preview<\/div><h1>The diagnostic journey<\/h1><p>Follow the testing pathway beyond the specimens that reach the laboratory.<\/p><\/header><main><section class=\"panel\"><div class=\"eyebrow\">Section 2 · Step 1 of 3<\/div><h2>Who becomes visible in laboratory data?<\/h2><p><strong>All counts and subgroup patterns in this case are hypothetical.<\/strong><\/p>\n<p>A community sexual-health program offers home-collection kits for chlamydia and gonorrhea testing, using a collection system authorized for that setting. Its laboratory reports excellent specimen acceptance and turnaround time. The program also tracks earlier steps:<\/p>\n<div class=\"table-wrap\"><table><tr><th>Step<\/th><th>Patients<\/th><\/tr><tr><td>Requested a kit<\/td><td>200<\/td><\/tr><tr><td>Kit dispatched<\/td><td>180<\/td><\/tr><tr><td>Specimen received by the laboratory<\/td><td>110<\/td><\/tr><tr><td>Valid result reported<\/td><td>106<\/td><\/tr><\/table><\/div>\n<p>Dispatch does not establish that a kit was received.<\/p><p><strong>Additional context:<\/strong> In this fictional program, written collection and return instructions are available only in English, although some patients prefer another language. Telephone assistance is available only during weekday work hours. These service features may matter to completion; the aggregate counts do not establish their effect or identify which patients encountered them.<\/p><form class=\"question\" data-key=\"B\" data-number=\"1\"><h3>Question 1<\/h3><p>What is the most important limitation of judging this program using laboratory acceptance and turnaround time alone?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> The difference between kits dispatched and specimens received establishes that home collection is unsuitable for this population.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> Those measures describe patients whose specimens arrived, while leaving earlier losses in the testing pathway largely unexamined.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> High specimen acceptance suggests that patients who did not return a kit probably no longer needed testing.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> Including all kit requests in the acceptance-rate denominator would reveal which barriers prevented completion.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: B.<\/strong> The laboratory can perform well for received specimens while many people never reach that stage. The counts locate incomplete transitions, but do not explain them. If reaching specimen receipt is more difficult for some patients, a dashboard beginning at receipt can conceal unequal access. These aggregate counts alone do not establish whether that occurred.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.accessdata.fda.gov/cdrh_docs/pdf20/DEN200070.pdf\" target=\"_blank\" rel=\"noopener\">FDA — Simple 2 Test authorization<\/a><\/li><li><a href=\"https://doi.org/10.1136/bmjopen-2017-017978\" target=\"_blank\" rel=\"noopener\">Manavi and Hodson — Factors associated with return of STI home sampling kits<\/a><\/li><li><a href=\"https://doi.org/10.1186/s12889-024-19741-x\" target=\"_blank\" rel=\"noopener\">Spence et al. — How does online postal self-sampling shape access to STI testing?<\/a><\/li><\/ul><p><small>These sources concern home sampling and access. The case counts and housing breakdown are hypothetical; the sources do not establish their cause.<\/small><\/p><\/div><\/div><\/form><button id=\"reveal\" hidden style=\"margin-top:20px\">Continue: see the housing breakdown<\/button><div id=\"stage2\" hidden><hr><div class=\"eyebrow\">Step 2 of 3 · New information<\/div><form class=\"question\" data-key=\"A\" data-number=\"2\"><h3>Question 2<\/h3><p>The program links kit requests with laboratory records and compares completion by housing circumstances:<\/p>\n<div class=\"table-wrap\"><table><tr><th>Step<\/th><th>Stable mailing address<\/th><th>Temporary or frequently changing address<\/th><\/tr><tr><td>Requested a kit<\/td><td>100<\/td><td>100<\/td><\/tr><tr><td>Kit dispatched<\/td><td>90<\/td><td>90<\/td><\/tr><tr><td>Specimen received<\/td><td>70<\/td><td>40<\/td><\/tr><tr><td>Valid result reported<\/td><td>68<\/td><td>38<\/td><\/tr><\/table><\/div>\n<p>These fictional categories do not describe everyone&#x27;s circumstances within each group.<\/p>\n<p>Which interpretation is best supported?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> Completion differs between the groups, with the largest measured gap emerging between dispatch and specimen receipt; delivery, collection, and return remain possible contributing steps.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> Similar dispatch rates indicate comparable access; the difference mainly concerns patients&#x27; decisions after receiving a kit.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> The lower receipt rate establishes that mailing failures are the main barrier for patients with changing addresses.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> Similar specimen acceptance among returned kits indicates that the program is equitable once collection begins.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: A.<\/strong> The linked data reveal a gap that the laboratory&#x27;s receipt-based dashboard concealed. Dispatch-to-receipt includes kit delivery, collection, packaging, and return. The data do not identify which contributed most.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://doi.org/10.1136/bmjopen-2017-017978\" target=\"_blank\" rel=\"noopener\">Manavi and Hodson — Factors associated with return of STI home sampling kits<\/a><\/li><li><a href=\"https://doi.org/10.1186/s12889-024-19741-x\" target=\"_blank\" rel=\"noopener\">Spence et al. — How does online postal self-sampling shape access to STI testing?<\/a><\/li><li><a href=\"https://doi.org/10.1371/journal.pmed.1002479\" target=\"_blank\" rel=\"noopener\">Wilson et al. — Internet-accessed STI testing: A randomised controlled trial<\/a><\/li><\/ul><p><small>These sources concern home sampling and access. The case counts and housing breakdown are hypothetical; the sources do not establish their cause.<\/small><\/p><\/div><\/div><\/form><div id=\"ending\" hidden><h3>Shared debrief<\/h3>\n<p>Laboratory records describe an important part of the pathway, but not everyone who sought testing. Linking program and laboratory records makes earlier losses visible; stratifying those transitions can reveal differences in completion.<\/p>\n<p>The pathologist contributes knowledge of specimen requirements, acceptance, and laboratory records. Program staff and patients contribute knowledge of delivery, collection, and return experiences. The case&#x27;s address categories describe circumstances relevant to the workflow, rather than a patient&#x27;s motivation or reliability.<\/p>\n<p><strong>Takeaway: Who reaches the laboratory shapes what laboratory data can show.<\/strong> Good performance among received specimens can coexist with unequal completion earlier in the pathway.<\/p><details><summary>Real-world evidence and case boundaries<\/summary><h3>Real-world basis<\/h3>\n<p><strong>Workflow feasibility:<\/strong> FDA&#x27;s 2023 authorization supports home-collected specimens shipped to a laboratory. It does not establish equitable completion.<\/p>\n<p><strong>Documented completion differences:<\/strong> Manavi and Hodson&#x27;s UK observational study reported return of 3,099 of 5,310 requested kits (58.4%). Kits requested from less deprived neighborhoods were more likely to be returned in adjusted analysis. The design did not establish why patients failed to return kits.<\/p>\n<p><strong>Patient experience:<\/strong> A 2024 qualitative study of 100 service users found that convenience and privacy could facilitate postal testing. Some participants&#x27; living situations made home delivery less private, so collecting a kit elsewhere was preferable. Limited representation of digitally excluded people constrains its applicability.<\/p>\n<p><strong>Benefits and scope:<\/strong> A 2017 London randomized trial increased STI testing uptake with an online postal service (50.0% versus 26.6%). Eligibility required internet access and ability to read English. It does not establish access for excluded populations.<\/p>\n<p><strong>Case boundary:<\/strong> Our counts, address categories, and subgroup gap remain hypothetical. These studies do not directly demonstrate lower return rates among people with temporary or changing addresses. Neighborhood deprivation and housing instability are different measures.<\/p>\n<p>References:<\/p>\n<p class=\"item\"><a href=\"https://www.accessdata.fda.gov/cdrh_docs/pdf20/DEN200070.pdf\" target=\"_blank\" rel=\"noopener\">FDA — Simple 2 Test authorization<\/a>.<\/p>\n<p class=\"item\"><a href=\"https://doi.org/10.1136/bmjopen-2017-017978\" target=\"_blank\" rel=\"noopener\">Manavi and Hodson — Factors associated with return of STI home sampling kits<\/a>. BMJ Open. 2017;7:e017978.<\/p>\n<p class=\"item\"><a href=\"https://doi.org/10.1186/s12889-024-19741-x\" target=\"_blank\" rel=\"noopener\">Spence et al. — How does online postal self-sampling shape access to STI testing?<\/a>. BMC Public Health. 2024;24:2339.<\/p>\n<p class=\"item\"><a href=\"https://doi.org/10.1371/journal.pmed.1002479\" target=\"_blank\" rel=\"noopener\">Wilson et al. — Internet-accessed STI testing: A randomised controlled trial<\/a>. PLOS Medicine. 2017;14:e1002479.<\/p><\/details><button id=\"follow\" type=\"button\">Continue: follow the result beyond the laboratory<\/button><\/div><\/div><\/section><section class=\"panel\" id=\"stage3\" hidden><div class=\"eyebrow\">Step 3 of 3 · Following the result beyond the laboratory<\/div><h2>A reported result is not the end of the pathway<\/h2><p><strong>This local workflow and the patients are fictional.<\/strong><\/p><p>A pathology trainee joins a review of STI testing across a community clinic and a youth correctional facility. Both services use the same laboratory, which meets its reporting target. The community clinic’s usual follow-up pathway asks patients to check their portal or call to arrange care.<\/p><p>In this fictional review, some patients in custody cannot independently use that pathway, and some recently released patients do not have reliable private phone access or a stable address. Other patients can readily receive messages and arrange follow-up. These circumstances vary within each setting; incarceration or housing status alone does not establish an individual’s access.<\/p><form class=\"question\" data-number=\"3\" data-key=\"C\"><h3>Question 3<\/h3><p>What makes this an equity concern beyond the laboratory’s reporting performance?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q3\" value=\"A\"><span><b>A<\/b> A shared reporting target establishes comparable opportunity for follow-up, even if communication arrangements differ.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"B\"><span><b>B<\/b> Patients released before results return can be counted as untreated because the facility cannot document subsequent care.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"C\"><span><b>C<\/b> A pathway that relies on patients receiving messages and arranging care can create different opportunities to benefit from the same reported result.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"D\"><span><b>D<\/b> Comparing turnaround time between settings would establish whether communication barriers caused a treatment disparity.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: C.<\/strong> The equity concern is the fit between the follow-up pathway and patients’ access to communication and control over obtaining care. Identical laboratory performance does not establish equal opportunity to benefit. The fictional observations identify a potential mechanism, not a measured treatment disparity. Unknown follow-up is not established absence of treatment.<\/p><div class=\"answer-sources\"><p><strong>Reference for this explanation<\/strong><\/p><p><a href=\"https://wwwnc.cdc.gov/eid/article/30/13/23-0712_article\" target=\"_blank\" rel=\"noopener\">Wolf et al. — Screening for Chlamydia and Gonorrhea in Youth Correctional Facilities, Utah, USA (2024)<\/a><\/p><p><small>The study documents a transition before results returned and unknown treatment after release. It does not establish a follow-up disparity compared with community patients.<\/small><\/p><\/div><\/div><\/form><div id=\"followending\" hidden><details><summary>Real-world basis and limits<\/summary><p>Wolf and colleagues studied screening in 12 Utah youth correctional facilities during October 2021–May 2023. Among youth testing positive for chlamydia, gonorrhea, or both, 25.35% were released before results were known. Those treated in custody received treatment within two days of results. Released youth were referred to local health departments; treatment data after release were unavailable.<\/p><p>This supports examining the transition between a reported result and care. It does not show that released youth went untreated, compare follow-up with community patients, or establish phone or housing barriers as the cause. The communication constraints in this teaching case are fictional.<\/p><p><a href=\"https://wwwnc.cdc.gov/eid/article/30/13/23-0712_article\" target=\"_blank\" rel=\"noopener\">Read the study — Methods and Treatment for Positive Results<\/a><\/p><p><small>Source checked October 4, 2026.<\/small><\/p><\/details><p><strong>Takeaway: Reporting a result and having an opportunity to benefit from it are different outcomes.<\/strong><\/p><p><strong>Reflection:<\/strong> Which parts of the pathway depend on the patient’s resources or freedom to act, and which depend on coordination between institutions?<\/p><\/div><\/section><p class=\"footer\">Review preview · All case counts and housing-related patterns are hypothetical · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();let selected=f.querySelector('input:checked');if(!selected)return;let feedback=f.querySelector('.feedback');feedback.hidden=false;feedback.dataset.result=selected.value===f.dataset.key?'correct':'incorrect';f.dataset.result=feedback.dataset.result;feedback.querySelector('.verdict').textContent=selected.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';if(f.dataset.number==='1')document.querySelector('#reveal').hidden=false;else if(f.dataset.number==='2')document.querySelector('#ending').hidden=false;else document.querySelector('#followending').hidden=false;});document.querySelector('#reveal').onclick=e=>{document.querySelector('#stage2').hidden=false;e.currentTarget.hidden=true;document.querySelector('#stage2').scrollIntoView({behavior:'smooth',block:'start'});};document.querySelector('#follow').onclick=e=>{document.querySelector('#stage3').hidden=false;e.currentTarget.hidden=true;document.querySelector('#stage3').scrollIntoView({behavior:'smooth',block:'start'});};<\/script><\/html>"},{"label":"3 · NGS access","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Diagnostic journey preview<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid # .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 3 preview<\/div><h1>Molecular testing access<\/h1><p>Consider what unequal testing receipt means at different points in care.<\/p><\/header><main><section class=\"panel\"><div class=\"eyebrow\">Section 3 · Step 1 of 2<\/div><h2>Access to diagnostic characterization and its timing<\/h2><p>A 2022 observational study found that, among patients with advanced nonsquamous non–small-cell lung cancer, <strong>29.7% of Black patients versus 36.6% of White patients received NGS testing before first-line therapy<\/strong>.<\/p><form class=\"question\" data-key=\"D\" data-number=\"1\"><h3>Question 1<\/h3><p>A colleague asks, “But both groups received a cancer diagnosis—what diagnostic disparity remains?” Which response best captures the concern?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> The difference primarily concerns treatment delivery because the diagnostic process ended when lung cancer was identified.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> The difference suggests that the original cancer diagnoses were less accurate among Black patients.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> A diagnostic disparity would exist only if testing revealed actionable alterations at different rates between the groups.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> The cancer was identified, but molecular characterization was available less often before treatment for Black patients, leaving potentially relevant features of their tumors less fully assessed.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: D.<\/strong> A diagnosis can correctly name the disease while leaving clinically relevant features uncharacterized. Here, the documented disparity concerns receipt of molecular testing before treatment—not demonstrated differences in diagnostic accuracy or the prevalence of actionable alterations. The testing measure does not establish when a completed report became available.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://pubmed.ncbi.nlm.nih.gov/35737912/\" target=\"_blank\" rel=\"noopener\">Disparities in Biomarker Testing and Clinical Trial Enrollment Among Patients With Lung, Breast, or Colorectal Cancers in the United States<\/a><\/li><\/ul><p><small>See the case evidence note for the population, scope, and limitations of this source. Case interpretation does not establish an individual cause.<\/small><\/p><\/div><\/div><\/form><button id=\"reveal\" hidden style=\"margin-top:20px\">Continue: see testing at any time<\/button><div id=\"stage2\" hidden><hr><div class=\"eyebrow\">Step 2 of 2 · New information<\/div><form class=\"question\" data-key=\"B\" data-number=\"2\"><h3>Question 2<\/h3><p>The study also reported lower NGS testing rates among Black patients <strong>at any time during the study<\/strong>, not only before first-line therapy: <strong>43.8% versus 54.7%<\/strong> among White patients.<\/p>\n<p>Why does distinguishing “before first-line therapy” from “at any time” matter?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> Testing completed later establishes that patients had equivalent access to molecular information when treatment began.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> The two measures describe different opportunities: whether testing occurred during the observed period and whether molecular information could inform the initial treatment decision.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> Testing before treatment primarily measures laboratory turnaround time, while testing at any time measures clinicians&#x27; ordering practices.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> The difference between the measures establishes that delayed testing changed treatment outcomes.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: B.<\/strong> Eventually receiving testing is different from having molecular information available at an earlier decision point. An “ever tested” measure can miss unequal opportunities to use information when initial treatment decisions are made. Neither measure alone establishes why testing was absent or delayed, whether results were available when needed, or how treatment outcomes were affected.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://pubmed.ncbi.nlm.nih.gov/35737912/\" target=\"_blank\" rel=\"noopener\">Disparities in Biomarker Testing and Clinical Trial Enrollment Among Patients With Lung, Breast, or Colorectal Cancers in the United States<\/a><\/li><\/ul><p><small>See the case evidence note for the population, scope, and limitations of this source. Case interpretation does not establish an individual cause.<\/small><\/p><\/div><\/div><\/form><div id=\"ending\" hidden><h3>Shared takeaway<\/h3>\n<p><strong>A diagnosis can be established while access to clinically relevant characterization remains unequal.<\/strong> Access also has a timing dimension: whether testing occurs and when its information becomes available describe different aspects of care.<\/p><p><strong>Access context:<\/strong> Insurance coverage, authorization requirements, and patient cost can be relevant questions when testing is not received. They are not established explanations for the racial differences shown here. A testing-rate comparison alone cannot distinguish financial barriers from ordering, specimen availability, clinical context, or other mechanisms.<\/p><details><summary>Real-world evidence and case boundaries<\/summary><h3>Real-world basis<\/h3>\n<p>The quoted rates come from a retrospective observational analysis of a real-world deidentified database. They document differences in testing receipt in the studied population and period. They do not establish that every untested patient had an actionable alteration, that testing would have changed every treatment decision, or that the observed gap has the same size in every setting today. The colleague&#x27;s question is an educational framing, not a quoted study exchange.<\/p>\n<p>Reference: <a href=\"https://pubmed.ncbi.nlm.nih.gov/35737912/\" target=\"_blank\" rel=\"noopener\">Disparities in Biomarker Testing and Clinical Trial Enrollment Among Patients With Lung, Breast, or Colorectal Cancers in the United States<\/a>. JCO Precision Oncology. 2022;6:e2100427.<\/p><\/details><p class=\"footer\">Section complete. You can revisit either answer above.<\/p><\/div><\/div><\/section><p class=\"footer\">Review preview · Testing rates are published findings; the educational conversation is hypothetical · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();let selected=f.querySelector('input:checked');if(!selected)return;let feedback=f.querySelector('.feedback');feedback.hidden=false;feedback.dataset.result=selected.value===f.dataset.key?'correct':'incorrect';f.dataset.result=feedback.dataset.result;feedback.querySelector('.verdict').textContent=selected.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';if(f.dataset.number==='1')document.querySelector('#reveal').hidden=false;else document.querySelector('#ending').hidden=false;});document.querySelector('#reveal').onclick=e=>{document.querySelector('#stage2').hidden=false;e.currentTarget.hidden=true;document.querySelector('#stage2').scrollIntoView({behavior:'smooth',block:'start'});};<\/script><\/html>"},{"label":"4 · Testing eligibility","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Testing eligibility preview<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 4 preview<\/div><h1>Who is considered for testing?<\/h1><p>Explore how a demographic shortcut can shape access before a specimen is collected.<\/p><\/header><main><section class=\"panel\"><div class=\"eyebrow\">Section 4 · One case<\/div><h2>Bias before the specimen<\/h2><p>Before a specimen reaches the laboratory, ordering rules and assumptions can shape who is considered for testing. Hemoglobinopathy testing is one example of this broader issue.<\/p>\n<p><strong>Hypothetical case<\/strong><\/p>\n<p>A pathology resident reviews a prenatal hemoglobinopathy-testing order set. Its decision support uses the patient&#x27;s recorded race or ethnicity to determine whether to display a testing recommendation.<\/p>\n<p>A colleague explains: “Some hemoglobinopathies are more common in particular ancestry groups, so this helps identify patients who need testing.”<\/p><form class=\"question\" data-key=\"D\" data-number=\"1\"><h3>Question 1<\/h3><p>What is the central equity concern with this approach?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> Differences in condition frequency across populations have no relevance to laboratory medicine.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> The main concern is whether patients can select more than one racial category; adding that option would resolve the limitation.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> The decision support would be appropriate if the laboratory used the same analytical method for every specimen.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> Recorded race or ethnicity may inadequately represent genetic ancestry, leaving some patients without an offer of testing despite potentially relevant carrier status.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: D.<\/strong> Population patterns can be informative, but a demographic category is an imperfect proxy for an individual&#x27;s genetics. When that category determines who is offered testing, its limitations can affect access before a specimen is collected.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.acog.org/clinical/clinical-guidance/practice-advisory/articles/2022/08/hemoglobinopathies-in-pregnancy\" target=\"_blank\" rel=\"noopener\">ACOG — Hemoglobinopathies in Pregnancy<\/a><\/li><\/ul><p><small>See the case evidence note for the population, scope, and limitations of this source. Case interpretation does not establish an individual cause.<\/small><\/p><\/div><\/div><\/form><div id=\"ending\" hidden><p><strong>Takeaway: A demographic shortcut can become a testing barrier.<\/strong> The issue extends beyond how a laboratory analyzes specimens to how patients become eligible for testing.<\/p><details><summary>Real-world basis and screening scope<\/summary><h3>Real-world basis<\/h3>\n<p>ACOG&#x27;s 2022 advisory explicitly moved away from a race/ethnicity-based approach. It recommends offering hemoglobinopathy testing to people planning pregnancy or at the initial prenatal visit when prior results are unavailable for interpretation. The advisory identifies race and self-reported ethnicity as poor proxies for genetics. The order set above is hypothetical; the recommendation concerns this reproductive screening context and is not a claim that every laboratory test should be offered universally.<\/p>\n<p>Reference: <a href=\"https://www.acog.org/clinical/clinical-guidance/practice-advisory/articles/2022/08/hemoglobinopathies-in-pregnancy\" target=\"_blank\" rel=\"noopener\">ACOG — Hemoglobinopathies in Pregnancy<\/a>.<\/p>\n<\/details><p class=\"footer\">Section complete. You can revisit your answer above.<\/p><\/div><\/section><p class=\"footer\">Review preview · Hypothetical order set · No timer or passing score.<\/p><\/main><script>document.querySelector('form').onsubmit=e=>{e.preventDefault();const f=e.currentTarget,choice=f.querySelector('input:checked');if(!choice)return;const box=f.querySelector('.feedback');box.hidden=false;box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';document.querySelector('#ending').hidden=false;};<\/script><\/html>"},{"label":"5 · Reference populations","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Reference populations and assay coverage<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 5 preview<\/div><h1>Reference populations<br>and assay coverage<\/h1><p>Consider how intervals, eligibility thresholds, and assay targets can affect patients differently.<\/p><\/header><main><section class=\"panel\"><div class=\"stage\" id=\"stage1\" ><div class=\"eyebrow\">Step 1 of 3<\/div><h3>Case: Who informs the reference interval?<\/h3>\n<p><strong>Hypothetical case<\/strong><\/p>\n<p>A patient&#x27;s absolute neutrophil count (ANC) is <strong>1,400/µL<\/strong>, flagged below the laboratory&#x27;s reference interval. Previous counts are similar. The patient has confirmed <strong>Duffy-null status<\/strong>, which is associated with lower circulating neutrophil counts.<\/p>\n<p>During a laboratory consultation, a clinician asks whether the flag necessarily indicates a disease process.<\/p><form class=\"question\" data-key=\"C\" data-number=\"1\"><h3>Question 1<\/h3><p>Which response best explains the reference-interval issue?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> A result below the laboratory interval establishes an abnormality requiring the same interpretation in every patient.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> Duffy-null status means that a low ANC can always be dismissed.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> A Duffy-null–informed interval may classify the count differently; the flag alone does not establish disease.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> The interval should be selected using the patient&#x27;s recorded race because it reliably identifies Duffy-null status.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: C.<\/strong> An accurately measured result can be flagged against an interval that does not adequately reflect a relevant biological characteristic. Confirmed Duffy-null status provides information that race alone cannot establish. It also does not exclude other causes of a low count.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10282887/\" target=\"_blank\" rel=\"noopener\">Development of Duffy Null–Specific Absolute Neutrophil Count Reference Ranges<\/a><\/li><\/ul><p><small>See the accompanying evidence note for the study or guidance scope. The teaching scenario is not a patient-specific recommendation.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><details><summary>Evidence and scope<\/summary><p><strong>Real-world basis:<\/strong> A 2023 study estimated a central 95% ANC reference interval of <strong>1,210–5,390/µL<\/strong> from 120 Duffy-null samples in a selected adult primary-care cohort. Participants self-identified as Black or African American; the study was not a representative sample of all Duffy-null populations. This illustrates why the population informing an interval matters; it is not a universal diagnostic or treatment threshold.<\/p>\n<p>Reference: <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC10282887/\" target=\"_blank\" rel=\"noopener\">Development of Duffy Null–Specific Absolute Neutrophil Count Reference Ranges<\/a>. JAMA. 2023;329(23):2088–2089.<\/p><\/details><button class=\"continue\" type=\"button\" data-next=\"2\">Continue to step 2<\/button><\/div><\/div><div class=\"stage\" id=\"stage2\" hidden><div class=\"eyebrow\">Step 2 of 3<\/div><form class=\"question\" data-key=\"D\" data-number=\"2\"><h3>Question 2<\/h3><p>A research team uses a fixed minimum ANC to determine eligibility for a cancer trial. The threshold falls within the published reference interval for some healthy Duffy-null individuals.<\/p>\n<p>What equity concern does this raise?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> A single threshold ensures equitable eligibility because the same rule applies to every participant.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> The concern can be resolved by applying a lower threshold to everyone recorded as Black.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> A Duffy-null–specific reference interval establishes that every individual within it can safely receive the trial treatment.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> Some individuals may be excluded because their baseline count falls below the threshold, even when that count is consistent with their Duffy-null status.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: D.<\/strong> A uniform threshold can affect people differently when their baseline distributions differ. A reference interval describes a population distribution; it does not establish treatment safety or replace a treatment-specific assessment.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2823538\" target=\"_blank\" rel=\"noopener\">Cancer Trial Eligibility and Therapy Modifications for Individuals With Duffy Null–Associated Neutrophil Count<\/a><\/li><\/ul><p><small>See the accompanying evidence note for the study or guidance scope. The teaching scenario is not a patient-specific recommendation.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><details><summary>Evidence and scope<\/summary><p><strong>Real-world basis:<\/strong> A 2024 cross-sectional analysis examined 289 phase 3 cancer trials and 71 curative-intent anticancer regimens. It found that 76.5% of the trials had explicit or implicit eligibility restrictions affecting ANC values within the Duffy-null–associated reference range. This was an analysis of criteria, not a measurement of how many Duffy-null patients were actually excluded or a treatment-safety trial. It supports the concern about how thresholds are used, rather than a universal recommendation to lower them.<\/p>\n<p>Reference: <a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2823538\" target=\"_blank\" rel=\"noopener\">Cancer Trial Eligibility and Therapy Modifications for Individuals With Duffy Null–Associated Neutrophil Count<\/a>.<\/p><\/details>\n<h3>Shared debrief<\/h3>\n<p>The first question concerns how a result is interpreted against a reference population. The second concerns how a threshold determines access. Laboratory expertise can help distinguish those uses and explain the relevant evidence to clinical and research teams.<\/p>\n<h3>Things to keep in mind<\/h3>\n<p class=\"item\"><strong>The reference population helps shape what gets labeled abnormal.<\/strong> A technically accurate measurement may be compared with an interval that does not adequately reflect a relevant biological characteristic.<\/p>\n<p class=\"item\"><strong>Race does not establish Duffy status.<\/strong> A demographic category cannot substitute for the patient&#x27;s known biological characteristic.<\/p>\n<p class=\"item\"><strong>A reference interval is not a treatment-safety threshold.<\/strong> Being within an interval does not establish eligibility or safety for every intervention.<\/p><button class=\"continue\" type=\"button\" data-next=\"3\">Continue to step 3<\/button><\/div><\/div><div class=\"stage\" id=\"stage3\" hidden><div class=\"eyebrow\">Step 3 of 3<\/div><form class=\"question\" data-key=\"C\" data-number=\"3\"><h3>Question 3<\/h3><p><strong>Hypothetical case<\/strong><\/p>\n<p>A laboratory compares two targeted pharmacogenetic panels. Both accurately detect the variants they include. One tests only CYP2C9 *2 and *3; the other also includes *5, *6, *8, and *11.<\/p>\n<p>A colleague asks: “If both have excellent analytical accuracy, why would the additional variants matter for equity?”<\/p>\n<p>Which response best explains the concern?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q3\" value=\"A\"><span><b>A<\/b> Comparable analytical accuracy means the panels provide equivalent information across patient populations.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"B\"><span><b>B<\/b> The broader panel matters only when a patient&#x27;s recorded race establishes that they carry one of the additional variants.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"C\"><span><b>C<\/b> Accurate detection of included targets can coexist with coverage gaps relevant to different ancestry populations.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"D\"><span><b>D<\/b> More included variants necessarily make a panel clinically superior for every intended use.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: C.<\/strong> Accuracy for included targets and the scope of those targets are different properties. A negative finding on a limited panel does not exclude variants it never examined. Ancestry patterns help explain why coverage matters; they do not establish an individual&#x27;s genotype.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7057225/\" target=\"_blank\" rel=\"noopener\">AMP/CAP — Recommendations for Clinical CYP2C9 Genotyping Allele Selection<\/a><\/li><\/ul><p><small>See the accompanying evidence note for the study or guidance scope. The teaching scenario is not a patient-specific recommendation.<\/small><\/p><\/div><\/div><\/form><div c
