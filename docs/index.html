lass=\"support\" hidden><details><summary>Evidence and scope<\/summary><p><strong>Real-world basis:<\/strong> AMP/CAP’s 2019 CYP2C9 allele-selection recommendations include *2, *3, *5, *6, *8, and *11 in the Tier 1 minimum set, considering allele function, population frequency, and availability of reference materials. The additional alleles in this case are therefore not merely optional extras in that recommendation. Both panels are hypothetical; analytical accuracy for included targets does not establish adequate target selection. This example does not independently establish the representativeness of a clinical validation cohort or recommend treatment.<\/p>\n<p>Reference: <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7057225/\" target=\"_blank\" rel=\"noopener\">AMP/CAP — Recommendations for Clinical CYP2C9 Genotyping Allele Selection<\/a>.<\/p><\/details>\n<p><strong>Takeaway: What an assay leaves out can matter as much as how accurately it measures what is included.<\/strong><\/p><p class=\"footer\">Section complete. You can revisit your answers above.<\/p><\/div><\/div><\/section><p class=\"footer\">Review preview · Hypothetical cases with published evidence · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const choice=f.querySelector('input:checked');if(!choice)return;const box=f.querySelector('.feedback');box.hidden=false;box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';f.parentElement.querySelector('.support').hidden=false;});document.querySelectorAll('.continue').forEach(b=>b.onclick=()=>{let stage=document.querySelector('#stage'+b.dataset.next);stage.hidden=false;b.hidden=true;stage.scrollIntoView({behavior:'smooth',block:'start'});});<\/script><\/html>"},{"label":"6 · Test suitability","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Test suitability<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 6 preview<\/div><h1>Test suitability<br>in a particular setting<\/h1><p>Compare patient burden with the requirements for producing a usable result.<\/p><\/header><main><section class=\"panel\"><div class=\"stage\" id=\"stage1\" ><div class=\"eyebrow\">Step 1 of 2<\/div><p><strong>All local workflow descriptions in this case are hypothetical.<\/strong><\/p>\n<p>An adult community clinic serves many patients who previously received BCG vaccination. Work schedules and transportation make return visits difficult for some patients. The clinic and laboratory are considering options for testing for TB infection in patients for whom testing is indicated:<\/p>\n<div class=\"table-wrap\"><table><tr><th>Option<\/th><th>Proposed local workflow<\/th><\/tr><tr><td>Tuberculin skin test (TST)<\/td><td>Lower direct test cost, but requires a return visit for reading at 48–72 hours<\/td><\/tr><tr><td>QuantiFERON<\/td><td>Timely incubation requirements cannot currently be met through the proposed local workflow<\/td><\/tr><tr><td>T-SPOT.TB<\/td><td>Reference-laboratory testing is possible if transport meets the receiving laboratory&#x27;s acceptance requirements<\/td><\/tr><\/table><\/div>\n<p>These are fictional local constraints, not universal descriptions of vendor capability. The actual assay instructions and receiving laboratory requirements determine acceptable handling.<\/p><form class=\"question\" data-key=\"A\" data-number=\"1\"><h3>Question 1<\/h3><p>Which consideration most directly connects the choice of testing approach to equity?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> Return-visit and specimen-processing requirements may create different barriers across the clinic&#x27;s population.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> A single test policy ensures that all patients experience the same access to testing.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> The option with the lowest direct test cost minimizes the burden on patients.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> A test collected during one visit eliminates the main sources of unequal access.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: A.<\/strong> A test&#x27;s practical suitability includes what patients and the testing system must do to obtain a usable result. Equal policy, lower direct cost, or a single collection visit does not establish equivalent access.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.cdc.gov/tb/hcp/testing-diagnosis/interferon-gamma-release-assay.html\" target=\"_blank\" rel=\"noopener\">CDC — Clinical Testing Guidance for TB: Interferon Gamma Release Assay<\/a><\/li><li><a href=\"https://www.cdc.gov/tb/hcp/testing-diagnosis/tuberculin-skin-test.html\" target=\"_blank\" rel=\"noopener\">CDC — Clinical Testing Guidance for TB: Tuberculin Skin Test<\/a><\/li><\/ul><p><small>CDC guidance supports the testing principles. Local workflow and vendor constraints in this case are fictional, not universal assay specifications.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><button class=\"continue\" type=\"button\" data-next=\"2\">Continue to step 2<\/button><\/div><\/div><div class=\"stage\" id=\"stage2\" hidden><div class=\"eyebrow\">Step 2 of 2<\/div><form class=\"question\" data-key=\"B\" data-number=\"2\"><h3>Question 2<\/h3><p>The team favors a blood-based test because it avoids a return visit and is not affected by prior BCG vaccination. What limits that reasoning in the proposed workflow?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> Avoiding a return visit makes completion more feasible, so local processing arrangements are a secondary consideration.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> Those advantages depend on meeting the test&#x27;s specimen-handling and processing requirements.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> Lower direct cost favors the skin test unless the clinic documents how many patients miss return visits.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> Reference-laboratory testing resolves local constraints once the clinic has arranged a courier service.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: B.<\/strong> Patient-facing advantages can be lost if the workflow cannot reliably produce a valid result. Tests for TB infection do not, by themselves, distinguish latent infection from active disease.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.cdc.gov/tb/hcp/testing-diagnosis/interferon-gamma-release-assay.html\" target=\"_blank\" rel=\"noopener\">CDC — Clinical Testing Guidance for TB: Interferon Gamma Release Assay<\/a><\/li><li><a href=\"https://www.cdc.gov/tb/hcp/testing-diagnosis/tuberculin-skin-test.html\" target=\"_blank\" rel=\"noopener\">CDC — Clinical Testing Guidance for TB: Tuberculin Skin Test<\/a><\/li><\/ul><p><small>CDC guidance supports the testing principles. Local workflow and vendor constraints in this case are fictional, not universal assay specifications.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><p><strong>Real-world basis:<\/strong> CDC guidance describes the benefits of TB blood tests for BCG-vaccinated patients and patients unlikely to return for skin-test reading, alongside specimen-processing requirements and limitations. The case&#x27;s specific clinic logistics are hypothetical.<\/p>\n<p><strong>Takeaway: A test&#x27;s practical suitability depends on the population and testing setting.<\/strong><\/p>\n<h3>Things to keep in mind<\/h3>\n<p class=\"item\"><strong>Lower direct cost does not automatically mean lower patient burden.<\/strong> Repeat travel, time away from work, and incomplete testing also matter.<\/p>\n<p class=\"item\"><strong>Operational constraints are contextual.<\/strong> Staffing, transport, and processing capacity can change.<\/p>\n<p class=\"item\"><strong>Clinical usefulness extends beyond analytical performance.<\/strong> A test must be accessible and capable of producing information that can be used in care.<\/p>\n<p>References: <a href=\"https://www.cdc.gov/tb/hcp/testing-diagnosis/interferon-gamma-release-assay.html\" target=\"_blank\" rel=\"noopener\">CDC — Clinical Testing Guidance for TB: Interferon Gamma Release Assay<\/a> and <a href=\"https://www.cdc.gov/tb/hcp/testing-diagnosis/tuberculin-skin-test.html\" target=\"_blank\" rel=\"noopener\">CDC — Clinical Testing Guidance for TB: Tuberculin Skin Test<\/a>. Product labeling and receiving-laboratory instructions determine the handling requirements for the specific collection and testing workflow.<\/p><p class=\"footer\">Section complete. You can revisit your answers above.<\/p><\/div><\/div><\/section><p class=\"footer\">Review preview · Hypothetical cases with published evidence · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const choice=f.querySelector('input:checked');if(!choice)return;const box=f.querySelector('.feedback');box.hidden=false;box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';f.parentElement.querySelector('.support').hidden=false;});document.querySelectorAll('.continue').forEach(b=>b.onclick=()=>{let stage=document.querySelector('#stage'+b.dataset.next);stage.hidden=false;b.hidden=true;stage.scrollIntoView({behavior:'smooth',block:'start'});});<\/script><\/html>"},{"label":"7 · Stewardship","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Diagnostic stewardship<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 7 preview<\/div><h1>Diagnostic stewardship<br>through an equity lens<\/h1><p>Consider who is selected for testing and how its benefits and burdens are distributed.<\/p><\/header><main><section class=\"panel\"><div class=\"stage\" id=\"stage1\" ><div class=\"eyebrow\">Step 1 of 2<\/div><p>More testing is not automatically more equitable care. Tests can provide useful information while also producing uncertainty, follow-up burdens, and costs. Fewer tests can prevent harm, but clinically indicated testing can also be missed. The equity question includes who benefits and who experiences the burdens of a testing pathway.<\/p>\n<h2>Case: Who is selected for perinatal toxicology testing?<\/h2>\n<p><strong>Hypothetical case informed by published research.<\/strong><\/p>\n<p>A pathology resident reviewing newborn toxicology orders notices that newborns of Black birthing parents are tested more frequently than newborns of White birthing parents. The laboratory uses the same assay and reporting process for everyone.<\/p>\n<p>During an interdisciplinary discussion, someone asks: “If the laboratory handles every specimen consistently, where is the equity concern?”<\/p><form class=\"question\" data-key=\"C\" data-number=\"1\"><h3>Question 1<\/h3><p>Which response best explains the concern?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> Different testing rates indicate that the assay&#x27;s diagnostic performance differs between racial groups.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> Comparing positive-result rates among tested newborns would establish whether the difference in testing was justified.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> Consistent laboratory processing can coexist with unequal selection for testing, exposing some families more frequently to testing and its downstream consequences.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> Testing rates are primarily an ordering issue; laboratory equity is better assessed through analytical performance and turnaround time.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: C.<\/strong> The laboratory may produce technically accurate results while participating in a testing pathway that affects populations differently. The disparity begins before the specimen arrives.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2802124\" target=\"_blank\" rel=\"noopener\">Schoneich et al. — Incidence of Newborn Drug Testing and Variations by Birthing Parent Race and Ethnicity Before and After Recreational Cannabis Legalization<\/a><\/li><\/ul><p><small>See the case evidence note for the population, scope, and limitations of this source. Case interpretation does not establish an individual cause.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><p>A confuses selection with assay performance. D overlooks the laboratory&#x27;s role in understanding test use. B sounds reasonable, but results among selected patients cannot, by themselves, establish whether selection was appropriate.<\/p><button class=\"continue\" type=\"button\" data-next=\"2\">Continue to step 2<\/button><\/div><\/div><div class=\"stage\" id=\"stage2\" hidden><div class=\"eyebrow\">Step 2 of 2<\/div><form class=\"question\" data-key=\"B\" data-number=\"2\"><h3>Question 2<\/h3><p>An obstetric clinician asks whether testing every newborn would resolve the equity concern by removing discretion. Which response best captures the limitation of that approach?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> Universal testing would address the equity concern because every newborn would have the same opportunity for detection.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> Universal testing could reduce differences in selection, but its clinical value, consent process, and downstream consequences would still matter.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> Universal testing would be justified if the laboratory confirmed every positive screening result before reporting it.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> Universal testing would be justified if the overall positive-result rate remained high enough to support its use.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: B.<\/strong> Making testing universal could change who is selected, but equal testing is not automatically equitable or beneficial testing. Analytical confirmation addresses one source of uncertainty; it does not establish that testing everyone improves care. Likewise, a positive-result rate alone does not describe how results affect patients and families.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2802124\" target=\"_blank\" rel=\"noopener\">Schoneich et al. — Incidence of Newborn Drug Testing and Variations by Birthing Parent Race and Ethnicity Before and After Recreational Cannabis Legalization<\/a><\/li><\/ul><p><small>See the case evidence note for the population, scope, and limitations of this source. Case interpretation does not establish an individual cause.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><p>The pathologist&#x27;s contribution is to connect the test&#x27;s capabilities and limitations with its intended clinical use, in discussion with obstetrics, pediatrics, and other involved teams. This question does not establish that universal testing is the preferred policy.<\/p>\n<details><summary>Evidence and scope<\/summary><h3>Real-world basis<\/h3>\n<p>A 2023 single-center retrospective study of 26,366 births from 2014–2020 documented racial differences in newborn drug-test ordering. Among births without prenatal urine drug testing, orders occurred in 7.3% of newborns of Black birthing parents compared with 1.9% of newborns of White birthing parents. The study did not capture testing indications and excluded births without prenatal care at that center. These findings support the selection concern without establishing why each order occurred or the same pattern in every setting. The case does not make a current jurisdiction-specific claim about reporting or consent requirements.<\/p>\n<p>Reference: <a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2802124\" target=\"_blank\" rel=\"noopener\">Schoneich et al. — Incidence of Newborn Drug Testing and Variations by Birthing Parent Race and Ethnicity Before and After Recreational Cannabis Legalization<\/a>. JAMA Network Open. 2023;6(3):e232058.<\/p>\n<\/details><h3>Why this belongs in stewardship<\/h3>\n<p>Stewardship includes the purpose and consequences of testing, alongside its frequency. In this case, the equity concern begins with who is selected for testing. Consistent specimen processing alone cannot resolve that concern.<\/p>\n<h3>Things to keep in mind<\/h3>\n<p class=\"item\"><strong>Equal processing does not guarantee equitable testing.<\/strong> Selection can differ before a specimen reaches the laboratory.<\/p>\n<p class=\"item\"><strong>A difference in testing is a finding, not its complete explanation.<\/strong> Ordering patterns need clinical and institutional context.<\/p>\n<p class=\"item\"><strong>A positive result is not a complete clinical assessment.<\/strong> Its meaning depends on the specimen, method, timing, medications, and clinical circumstances.<\/p>\n<p class=\"item\"><strong>More detection is not automatically better care.<\/strong> The consequences of identifying an exposure also matter.<\/p>\n<details><summary>Optional reflection: when less testing raises equity concerns<\/summary><h2>Brief reflection: When less testing also raises equity concerns<\/h2>\n<p>Reducing unnecessary testing can prevent harm and conserve resources. Yet a restriction may affect patients differently depending on how easily they can return, obtain specialist review, or complete an alternative test.<\/p>\n<p>For example, a hypothetical policy requiring specialist approval for a send-out test may introduce little delay for an inpatient with an available consultation service, but a substantial barrier for someone whose next specialist appointment is months away. That difference does not establish that the restriction is inappropriate; it shows why overall reductions in test volume tell only part of the story.<\/p>\n<p><strong>Optional, unscored reflection:<\/strong> A laboratory reports fewer low-value send-out tests after introducing an approval requirement. What remains unknown about whether the change improved equity?<\/p>\n<p><strong>Discussion:<\/strong> The overall count does not reveal whether clinically indicated testing was delayed or forgone, who encountered those barriers, or whether accessible alternatives existed.<\/p>\n<\/details><p><strong>Takeaway: Selection for testing distributes benefits and burdens.<\/strong> Both unequal exposure to testing and unequal access to useful testing can matter.<\/p><p class=\"footer\">Section complete. You can revisit your answers above.<\/p><\/div><\/div><\/section><p class=\"footer\">Review preview · Hypothetical cases with published evidence · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const choice=f.querySelector('input:checked');if(!choice)return;const box=f.querySelector('.feedback');box.hidden=false;box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';f.parentElement.querySelector('.support').hidden=false;});document.querySelectorAll('.continue').forEach(b=>b.onclick=()=>{let stage=document.querySelector('#stage'+b.dataset.next);stage.hidden=false;b.hidden=true;stage.scrollIntoView({behavior:'smooth',block:'start'});});<\/script><\/html>"},{"label":"8 · Quality improvement","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Quality improvement<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 8 preview<\/div><h1>Quality improvement<br>and persistent disparities<\/h1><p>Follow how overall improvement, subgroup results, and operational context change the interpretation.<\/p><\/header><main><section class=\"panel\"><div class=\"stage\" id=\"stage1\" ><div class=\"eyebrow\">Step 1 of 3<\/div><p><strong>All counts in this case are hypothetical.<\/strong><\/p>\n<h2>Case: HCV testing completion<\/h2>\n<p>A laboratory and its clinical partners introduce a workflow change intended to improve completion of HCV RNA testing after a reactive antibody result.<\/p>\n<div class=\"table-wrap\"><table><tr><th>Measure<\/th><th>Before<\/th><th>After<\/th><\/tr><tr><td>Overall completion<\/td><td>130/200 (65%)<\/td><td>180/200 (90%)<\/td><\/tr><\/table><\/div><form class=\"question\" data-key=\"C\" data-number=\"1\"><h3>Question 1<\/h3><p>Completion increased from 65% to 90%. A colleague describes this as an equity improvement. Which response best assesses that claim?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> The increase supports an equity improvement because the same workflow was offered across settings.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> Equity would be better assessed by comparing RNA positivity across settings than completion.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> Completion improved overall; its distribution across settings remains unknown until the data are stratified.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> The increase supports an equity improvement if the number of participating patients remained stable.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: C.<\/strong> The overall result establishes improved completion in the measured population. Comparing completion across settings can show whether that improvement was distributed similarly. Neither a shared workflow nor stable participation establishes that distribution, and positivity answers a different question. These before-and-after counts do not establish causation or treatment initiation.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.cdc.gov/mmwr/volumes/72/wr/mm7228a2.htm\" target=\"_blank\" rel=\"noopener\">CDC — Updated Operational Guidance for Implementing CDC&#x27;s Recommendations on Testing for Hepatitis C Virus Infection<\/a><\/li><\/ul><p><small>CDC guidance supports the HCV workflow premise. The percentages, clinic differences, and supply observations are hypothetical; the numerical interpretation comes from the case itself.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><button class=\"continue\" type=\"button\" data-next=\"2\">Continue to step 2<\/button><\/div><\/div><div class=\"stage\" id=\"stage2\" hidden><div class=\"eyebrow\">Step 2 of 3<\/div><form class=\"question\" data-key=\"D\" data-number=\"2\"><h3>Question 2<\/h3><h3>Completion by setting<\/h3>\n<p>The team then separates the results by clinic setting:<\/p>\n<div class=\"table-wrap\"><table><tr><th>Setting<\/th><th>Before<\/th><th>After<\/th><\/tr><tr><td>Hospital clinics<\/td><td>90/100 (90%)<\/td><td>98/100 (98%)<\/td><\/tr><tr><td>Community clinics<\/td><td>40/100 (40%)<\/td><td>82/100 (82%)<\/td><\/tr><tr><td>Overall<\/td><td>130/200 (65%)<\/td><td>180/200 (90%)<\/td><\/tr><\/table><\/div>\n<p>What is supported by the stratified data?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> Community-clinic completion did not improve because it remained below hospital-clinic completion.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> Equal denominators establish equal opportunity to complete testing.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> The workflow change corrected the cause of the initial gap.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> Both settings improved and the absolute completion gap narrowed from 50 to 16 percentage points.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: D.<\/strong> The data show improvement in both settings and a narrower absolute gap. They do not identify the mechanisms or establish equal opportunity.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.cdc.gov/mmwr/volumes/72/wr/mm7228a2.htm\" target=\"_blank\" rel=\"noopener\">CDC — Updated Operational Guidance for Implementing CDC&#x27;s Recommendations on Testing for Hepatitis C Virus Infection<\/a><\/li><\/ul><p><small>CDC guidance supports the HCV workflow premise. The percentages, clinic differences, and supply observations are hypothetical; the numerical interpretation comes from the case itself.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><button class=\"continue\" type=\"button\" data-next=\"3\">Continue to step 3<\/button><\/div><\/div><div class=\"stage\" id=\"stage3\" hidden><div class=\"eyebrow\">Step 3 of 3<\/div><form class=\"question\" data-key=\"A\" data-number=\"3\"><h3>Question 3<\/h3><p>The team considers whether collection infrastructure contributes to remaining incomplete testing. Which finding most directly supports that possibility?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q3\" value=\"A\"><span><b>A<\/b> Missed collections clustered on days when required supplies were unavailable; observed collection practice was appropriate when supplies were available.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"B\"><span><b>B<\/b> Staff in lower-completion clinics requested additional training.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"C\"><span><b>C<\/b> Completion was lower in clinics that also had higher staff turnover and a different courier schedule.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"D\"><span><b>D<\/b> A staff survey found variation in knowledge of the new workflow.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: A.<\/strong> This finding links missed collections to a specific operational constraint more directly than the other observations. It supports a hypothesis without establishing that supplies explain every missed collection.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.cdc.gov/mmwr/volumes/72/wr/mm7228a2.htm\" target=\"_blank\" rel=\"noopener\">CDC — Updated Operational Guidance for Implementing CDC&#x27;s Recommendations on Testing for Hepatitis C Virus Infection<\/a><\/li><\/ul><p><small>CDC guidance supports the HCV workflow premise. The percentages, clinic differences, and supply observations are hypothetical; the numerical interpretation comes from the case itself.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><details><summary>Optional outcome reflection<\/summary><h3>Optional outcome reflection<\/h3>\n<p>Testing completion, successful patient contact, referrals, treatment initiation, and time to treatment describe different stages. Measures restricted to patients who reach a later stage can leave out those lost earlier in the pathway.<\/p>\n<\/details><h3>Participation and resources<\/h3>\n<p>Diverse participation can bring relevant perspectives into a QI discussion. Inclusion also involves whose perspectives influence decisions. One participant cannot represent every experience within a population. The same intervention may require different staff time, supplies, transport, or patient effort across settings.<\/p>\n<details><summary>Evidence and scope<\/summary><h3>Real-world basis<\/h3>\n<p>CDC’s 2023 HCV operational guidance recommends single-visit sample collection and automatic HCV RNA testing after a reactive antibody result. It defines automatic testing as occurring without additional action by the patient or provider and cites implementation reports showing improved completion. The guidance supports the workflow premise; it does not validate this case’s invented clinic-setting gaps, supply findings, or treatment outcomes. The fictional before-and-after counts do not establish causation.<\/p>\n<p>Reference: <a href=\"https://www.cdc.gov/mmwr/volumes/72/wr/mm7228a2.htm\" target=\"_blank\" rel=\"noopener\">CDC — Updated Operational Guidance for Implementing CDC&#x27;s Recommendations on Testing for Hepatitis C Virus Infection<\/a>.<\/p>\n<\/details><p><strong>Takeaway: Overall improvement can coexist with persistent disparities.<\/strong><\/p><p class=\"footer\">Section complete. You can revisit your answers above.<\/p><\/div><\/div><\/section><p class=\"footer\">Review preview · Hypothetical cases with published evidence · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const choice=f.querySelector('input:checked');if(!choice)return;const box=f.querySelector('.feedback');box.hidden=false;box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';f.parentElement.querySelector('.support').hidden=false;});document.querySelectorAll('.continue').forEach(b=>b.onclick=()=>{let stage=document.querySelector('#stage'+b.dataset.next);stage.hidden=false;b.hidden=true;stage.scrollIntoView({behavior:'smooth',block:'start'});});<\/script><\/html>"},{"label":"9 · Informatics and reporting","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · AI data and laboratory reporting<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}.feedback[data-result=\"incorrect\"]{background:#fff1f0;border-left-color:#b42318;color:#8f1d16}.feedback[data-result=\"incorrect\"] a{color:#8f1d16}.feedback[data-result=\"incorrect\"] .verdict{color:#b42318;font-weight:700}form[data-result=\"incorrect\"] label:has(input:checked){background:#fff1f0;border-color:#b42318;color:#8f1d16}form[data-result=\"incorrect\"] input:checked{accent-color:#b42318}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 9 preview<\/div><h1>AI data and<br>laboratory reporting<\/h1><p>Explore how data definitions and reporting logic shape the information available for care.<\/p><\/header><main><section class=\"panel\"><div class=\"stage\" id=\"stage1\" ><div class=\"eyebrow\">Case 1 of 3<\/div><h2>Case 1: What does the AI training label represent?<\/h2>\n<p>A team develops a model to identify a condition using EHR and laboratory data. Patients with a qualifying abnormal test result are labeled positive. All other patients, including those never tested, are labeled negative.<\/p><form class=\"question\" data-key=\"D\" data-number=\"1\"><h3>Question 1<\/h3><p>What is the central concern with this label definition?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q1\" value=\"A\"><span><b>A<\/b> Laboratory results cannot contribute useful information to an AI model.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"B\"><span><b>B<\/b> A large dataset makes differences in testing access unlikely to affect the model.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"C\"><span><b>C<\/b> Identical label rules ensure equivalent label accuracy across patient populations.<\/span><\/label><label><input type=\"radio\" required name=\"q1\" value=\"D\"><span><b>D<\/b> The model may learn patterns of being tested and having the condition detected, rather than underlying disease status.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: D.<\/strong> Untested patients are not established negatives. If testing differs across populations, the labels can encode those differences. This identifies a plausible mechanism; it does not establish harm from a deployed model.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11524489/\" target=\"_blank\" rel=\"noopener\">Racial differences in laboratory testing as a potential mechanism for bias in AI: A matched cohort analysis in emergency department visits<\/a><\/li><\/ul><p><small>The cited work supports the case premise. The fictional scenario illustrates a concern and does not establish harm from a deployed AI system or a rule for every analyte.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><p>A useful interdisciplinary discussion connects the data team&#x27;s label definitions, clinicians&#x27; ordering context, and the laboratory&#x27;s knowledge of canceled, rejected, or outside-system testing.<\/p>\n<details><summary>Evidence and scope<\/summary><p><strong>Real-world basis:<\/strong> Chang and colleagues (2024) studied Black and White adult emergency-department visits at two U.S. teaching hospitals. After matching on age, recorded sex, chief complaint, and triage score, Black patients had lower rates of CBC, metabolic-panel, and blood-culture testing; troponin testing showed the opposite direction. The authors discussed how testing-dependent labels could introduce AI bias. They did not evaluate harm from a deployed model or establish why each ordering difference occurred. The model and label definition in this case are hypothetical.<\/p>\n<p>Reference: <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC11524489/\" target=\"_blank\" rel=\"noopener\">Racial differences in laboratory testing as a potential mechanism for bias in AI: A matched cohort analysis in emergency department visits<\/a>.<\/p><\/details><button class=\"continue\" type=\"button\" data-next=\"2\">Continue to the reporting case<\/button><\/div><\/div><div class=\"stage\" id=\"stage2\" hidden><div class=\"eyebrow\">Case 2 of 3<\/div><h2>Case 2: The result did not change, but the flag did<\/h2>\n<p>A patient&#x27;s hemoglobin result is unchanged. After a legal-sex field is updated, the result changes from flagged high to unflagged. The patient is receiving testosterone. The laboratory and EHR maintain separate fields for gender identity, sex assigned at birth, and legal sex.<\/p>\n<h3>What changed?<\/h3>\n<p>In this hypothetical case, the LIS selected a different reference interval using the updated legal-sex field. The unchanged value falls between the two upper limits. A flag reflects comparison with a configured interval; its change does not resolve clinical interpretation.<\/p><form class=\"question\" data-key=\"C\" data-number=\"2\"><h3>Question 2<\/h3><p>Which consideration best supports interpretation of the result?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q2\" value=\"A\"><span><b>A<\/b> Gender identity alone supplies the appropriate interval for every analyte.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"B\"><span><b>B<\/b> Sex assigned at birth alone supplies the appropriate interval for every analyte.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"C\"><span><b>C<\/b> Interval selection depends on the analyte and relevant physiology, including hormone exposure and duration.<\/span><\/label><label><input type=\"radio\" required name=\"q2\" value=\"D\"><span><b>D<\/b> Legal sex is the preferred physiological variable for all laboratory reporting.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: C.<\/strong> No single demographic field supplies a universal answer for all analytes. The case invites discussion of laboratory reporting and the evidence relevant to the specific measurement.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://pubmed.ncbi.nlm.nih.gov/38737625/\" target=\"_blank\" rel=\"noopener\">Impact of sex used for assignment of reference intervals in a population of patients taking gender-affirming hormones<\/a><\/li><li><a href=\"https://academic.oup.com/jalm/article/6/1/210/6041066\" target=\"_blank\" rel=\"noopener\">Providing Inclusive Care for Transgender Patients: Capturing Sex and Gender in Electronic Medical Record<\/a><\/li><li><a href=\"https://myadlm.org/science-and-research/academy-guidance/gender-diversity\" target=\"_blank\" rel=\"noopener\">ADLM — Gender Diversity guidance<\/a><\/li><\/ul><p><small>The cited work supports the case premise. The fictional scenario illustrates a concern and does not establish harm from a deployed AI system or a rule for every analyte.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><details><summary>Evidence and scope<\/summary><p><strong>Real-world basis:<\/strong> A 2024 study examined how sex used for reference-interval assignment affects abnormal-result flags in patients taking gender-affirming hormones. ADLM’s 2026 guidance also explicitly discusses legal-sex fields, EHR/LIS logic, and hemoglobin reporting. Its recommendations for selected analytes address patients stably receiving hormone therapy for at least six months; interpretation varies by analyte and clinical context. A changed flag may be appropriate—for example, a male hemoglobin interval in someone stably receiving testosterone. The exact software event here is hypothetical, and the case does not establish patient harm or a measured population disparity. Its equity concern is whether reporting systems support appropriate interpretation for gender-diverse patients. ADLM guidance is not a CAP accreditation requirement.<\/p>\n<p>References:<\/p>\n<p class=\"item\"><a href=\"https://pubmed.ncbi.nlm.nih.gov/38737625/\" target=\"_blank\" rel=\"noopener\">Impact of sex used for assignment of reference intervals in a population of patients taking gender-affirming hormones<\/a>.<\/p>\n<p class=\"item\"><a href=\"https://academic.oup.com/jalm/article/6/1/210/6041066\" target=\"_blank\" rel=\"noopener\">Providing Inclusive Care for Transgender Patients: Capturing Sex and Gender in Electronic Medical Record<\/a>.<\/p>\n<p class=\"item\"><a href=\"https://myadlm.org/science-and-research/academy-guidance/gender-diversity\" target=\"_blank\" rel=\"noopener\">ADLM — Gender Diversity guidance<\/a>.<\/p>\n<\/details><h3>Things to keep in mind<\/h3>\n<p class=\"item\"><strong>Improvement is not automatically improved equity.<\/strong> Overall metrics can improve while existing disparities persist.<\/p>\n<p class=\"item\"><strong>Not tested is not the same as negative.<\/strong> Absence of a measurement does not establish absence of a condition.<\/p>\n<p class=\"item\"><strong>A flag is a software comparison.<\/strong> A measurement can be accurate while its flag is misleading because of an unsuitable reference interval.<\/p>\n<p class=\"item\"><strong>A demographic difference is a finding, not its explanation.<\/strong> Multiple clinical, social, and structural processes can contribute.<\/p>\n<p class=\"item\"><strong>One perspective cannot represent an entire population.<\/strong> Experiences vary within and between populations.<\/p>\n<p><strong>Takeaway: Data and reporting choices shape what becomes visible.<\/strong><\/p><button class=\"continue\" type=\"button\" data-next=\"3\">Continue to the confidentiality case<\/button><\/div><\/div><div class=\"stage\" id=\"stage3\" hidden><div class=\"eyebrow\">Case 3 of 3<\/div><h2>Case 3: Covered testing, unequal privacy<\/h2><p><strong>This patient and local workflow are fictional.<\/strong><\/p><p>During an interdisciplinary review, a pathology trainee hears about a 22-year-old patient considering indicated chlamydia and gonorrhea testing while covered by a parent’s insurance plan. The patient is concerned that a billing communication might reveal the visit or testing to the policyholder. The clinic can collect the specimen and the laboratory can perform the assay, but the patient asks to postpone testing until the communication pathway is clarified.<\/p><p>The laboratory’s dashboard begins with specimens received and shows no processing problem. The review includes laboratory, clinical, billing, and privacy staff because each sees a different part of the pathway.<\/p><form class=\"question\" data-key=\"B\" data-number=\"3\"><h3>Question 3<\/h3><p>What does this case add to the interpretation of testing access?<\/p><fieldset><legend class=\"sr\">Choose an answer<\/legend><label><input type=\"radio\" required name=\"q3\" value=\"A\"><span><b>A<\/b> The concern is primarily administrative, so it falls outside an assessment of equitable testing access.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"B\"><span><b>B<\/b> Coverage and assay availability do not establish usable access when anticipated disclosure may carry different consequences for different patients.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"C\"><span><b>C<\/b> The patient’s decision establishes that billing disclosures are the cause of lower STI testing rates among insured young adults.<\/span><\/label><label><input type=\"radio\" required name=\"q3\" value=\"D\"><span><b>D<\/b> A confidential laboratory result would resolve the concern because billing communications are separate from the diagnostic pathway.<\/span><\/label><\/fieldset><button type=\"submit\">Reveal explanation<\/button><div class=\"feedback\" hidden role=\"status\"><p class=\"verdict\"><\/p><p><strong>Best answer: B.<\/strong> The opportunity to use testing includes more than specimen collection and analytical performance. A communication pathway can create burdens that vary with a patient’s circumstances. This fictional account identifies a barrier for one patient, not the prevalence of a population disparity or the cause of a published association. Keeping a result confidential does not, by itself, describe how billing information is communicated.<\/p><div class=\"answer-sources\"><p><strong>References for this explanation<\/strong><\/p><ul><li><a href=\"https://www.cdc.gov/mmwr/volumes/66/wr/mm6609a1.htm\" target=\"_blank\" rel=\"noopener\">Leichliter et al. — Confidentiality Issues and Use of STD Services (CDC, 2017)<\/a><\/li><li><a href=\"https://www.hhs.gov/hipaa/for-professionals/privacy/guidance/disclosures-treatment-payment-health-care-operations/index.html\" target=\"_blank\" rel=\"noopener\">HHS — Uses and Disclosures for Treatment, Payment, and Health Care Operations<\/a><\/li><\/ul><p><small>The CDC study supports the confidentiality-and-access concern; HHS guidance provides communication and payment context. Neither documents this fictional incident.<\/small><\/p><\/div><\/div><\/form><div class=\"support\" hidden><details><summary>Evidence and scope<\/summary><p>A 2017 CDC analysis of the 2013–2015 National Survey of Family Growth found that confidentiality concerns were associated with lower self-reported chlamydia testing among female respondents. Its confidentiality question covered sexually experienced respondents aged 15–17 and those aged 18–25 on a parent’s private insurance plan. The cross-sectional survey did not establish causation or isolate billing communications as the mechanism.<\/p><p>HHS guidance describes permitted treatment and payment disclosures and confidential-communication requests. Options depend on the applicable rules and setting; this case does not establish a legal violation or recommend a blanket delay of result release.<\/p><ul><li><a href=\"https://www.cdc.gov/mmwr/volumes/66/wr/mm6609a1.htm\" target=\"_blank\" rel=\"noopener\">Leichliter et al. — Confidentiality Issues and Use of STD Services (CDC, 2017)<\/a><\/li><li><a href=\"https://www.hhs.gov/hipaa/for-professionals/privacy/guidance/disclosures-treatment-payment-health-care-operations/index.html\" target=\"_blank\" rel=\"noopener\">HHS — Uses and Disclosures for Treatment, Payment, and Health Care Operations<\/a><\/li><\/ul><p><small>Sources checked October 4, 2026.<\/small><\/p><\/details><p><strong>Reflection:<\/strong> What becomes invisible when a laboratory measures only patients whose specimens arrive? How does concern about disclosure differ from inability to pay?<\/p><p class=\"item\"><strong>Coverage is not automatically usable access.<\/strong> Financial protection and privacy can affect the same testing decision in different ways.<\/p><p class=\"item\"><strong>Privacy is part of the diagnostic pathway.<\/strong> Result reporting and billing communications involve different systems and responsibilities.<\/p><p class=\"footer\">Section complete. Continue to Section 10 for the closing synthesis and further reading.<\/p><\/div><\/div><\/section><p class=\"footer\">Review preview · Hypothetical cases with published evidence · No timer or passing score.<\/p><\/main><script>document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const choice=f.querySelector('input:checked');if(!choice)return;const box=f.querySelector('.feedback');box.hidden=false;box.dataset.result=choice.value===f.dataset.key?'correct':'incorrect';f.dataset.result=box.dataset.result;box.querySelector('.verdict').textContent=choice.value===f.dataset.key?'Correct — your answer matches the best-supported interpretation.':'Incorrect — review the best-supported interpretation below.';f.parentElement.querySelector('.support').hidden=false;});document.querySelectorAll('.continue').forEach(b=>b.onclick=e=>{const stage=document.querySelector('#stage'+b.dataset.next);stage.hidden=false;e.currentTarget.hidden=true;stage.scrollIntoView({behavior:'smooth',block:'start'});});<\/script><\/html>"},{"label":"10 · Closing and further reading","html":"<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Health equity · Closing and further reading<\/title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172a3a;font:17px/1.65 system-ui,sans-serif}header{background:#102d40;color:white;padding:36px max(24px,calc((100vw - 920px)/2))}header p{color:#d1e2eb;max-width:760px;margin:8px 0}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#35716f}header .eyebrow{color:#a7dcd1}h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:12px 0}h2{font-size:29px;line-height:1.25}h3{font-size:21px}main{max-width:920px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{background:white;color:#173749;border:1px solid #c5d2db}.tabs button[aria-current=true]{background:#0f655f;color:white;border-color:#0f655f}.panel{background:white;border:1px solid #dbe3e9;border-radius:16px;padding:32px;box-shadow:0 8px 30px #112d4008}p{margin:14px 0}a{color:#006f80}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:14px;border-bottom:1px solid #dce5eb;text-align:left}th{background:#eaf3f4}.table-wrap{overflow:auto;margin:20px 0}.question{border-top:2px solid #c6e0db;margin-top:30px;padding-top:16px}fieldset{border:0;padding:0;margin:18px 0}label{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:9px 0;background:#f5f8fa;border:1px solid #d5e0e6;border-radius:8px;cursor:pointer}input{margin-top:7px;accent-color:#0f655f}label:has(input:checked){background:#e5f3ef;border-color:#0f655f}button{background:#0f655f;color:white;border:0;border-radius:7px;padding:12px 18px;font:650 15px system-ui;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #c48513;outline-offset:3px}.feedback,.match-feedback{background:#edf6f2;border-left:4px solid #0f655f;padding:16px 20px;margin:20px 0}.verdict{font-weight:700}details{margin:20px 0;padding:14px 18px;background:#f0f5f8;border-radius:8px}summary{cursor:pointer;font-weight:650}select{display:block;width:100%;padding:12px;font:inherit;border:1px solid #bcced8;border-radius:7px}.match label{background:none;border:0;padding:0;margin:20px 0 6px}.nav{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}.footer{font-size:13px;color:#526879}@media(max-width:600px){.panel{padding:20px}header{padding:28px 20px}}.answer-sources{margin-top:18px;padding-top:12px;border-top:1px solid #b9d4cc}.answer-sources ul{padding-left:22px}.answer-sources small{font-size:14px;line-height:1.55}<\/style><header><div class=\"eyebrow\">Laboratory medicine · Section 10<\/div><h1>Closing and further reading<\/h1><p>Bring the cases together and explore selected sources for further inquiry.<\/p><\/header><main><section class=\"panel\"><h2>The pathologist&#x27;s role in equitable diagnosis<\/h2>\n<p>A test can be analytically accurate while its benefits and burdens are distributed unequally. Who receives testing, what an assay detects, which reference interval is applied, and when information becomes available all shape its usefulness in care.<\/p>\n<p>Pathologists contribute by explaining both the information a test provides and its limits, in conversation with clinical teams, laboratory staff, patients, and informatics colleagues. That expertise can help others recognize when a testing or reporting choice may affect patients differently.<\/p>\n<p><strong>Understanding a test includes understanding its limits—and whom those limits may affect.<\/strong><\/p>\n<p>---<\/p><details><summary>Optional further reading<\/summary><h1>Optional further reading<\/h1>\n<p>These selected resources offer starting points for deeper inquiry. They are optional, not additional assessed content. Sources include empirical studies, professional guidance, and broader conceptual work; they serve different purposes. Case-specific references remain alongside each case.<\/p>\n<h2>Foundations and the diagnostic journey<\/h2>\n<p class=\"item\"><strong>World Health Organization — <a href=\"https://www.who.int/news-room/fact-sheets/detail/social-determinants-of-health\" target=\"_blank\" rel=\"noopener\">Social determinants of health<\/a>.<\/strong> An accessible overview connecting living conditions and broader social arrangements with health inequities. Useful for placing laboratory access within a wider context.<\/p>\n<p class=\"item\"><strong>National Academies — <a href=\"https://www.nationalacademies.org/read/21794\" target=\"_blank\" rel=\"noopener\">Improving Diagnosis in Health Care<\/a> (2015).<\/strong> A broader diagnostic-safety report on the diagnostic process, teamwork, and patients&#x27; participation. Relevant to the pathologist&#x27;s collaborative role, although not a laboratory-equity guideline.<\/p>\n<h2>Access, selection, and timing<\/h2>\n<p class=\"item\"><strong><a href=\"https://pubmed.ncbi.nlm.nih.gov/35737912/\" target=\"_blank\" rel=\"noopener\">Disparities in Biomarker Testing and Clinical Trial Enrollment Among Patients With Lung, Breast, or Colorectal Cancers in the United States<\/a> (2022).<\/strong> An empirical example of unequal receipt of clinically relevant molecular testing, including testing before first-line treatment. Supports discussion of access and timing without establishing every mechanism behind missing testing.<\/p>\n<p class=\"item\"><strong>Schoneich et al. — <a href=\"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2802124\" target=\"_blank\" rel=\"noopener\">Incidence of Newborn Drug Testing and Variations by Birthing Parent Race and Ethnicity Before and After Recreational Cannabis Legalization<\/a> (2023).<\/strong> A contrasting example: equity concerns can involve unequal exposure to testing and its consequences, rather than only insufficient testing.<\/p>\n<h2>Assays, reference populations, and reporting<\/h2>\n<p class=\"item\"><strong>AMP/CAP — <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7057225/\" target=\"_blank\" rel=\"noopener\">Recommendations for Clinical CYP2C9 Genotyping Allele Selection<\/a> (2019).<\/strong> A laboratory-specific example of how target selection and population allele frequencies matter beyond accuracy for included targets. These are gene-specific recommendations, not a universal panel-design rule.<\/p>\n<p class=\"item\"><strong>ADLM — <a href=\"https://myadlm.org/science-and-research/academy-guidance/gender-diversity\" target=\"_blank\" rel=\"noopener\">Guidance document on incorporating gender diversity in pathology and laboratory medicine<\/a> (2026).<\/strong> Covers analyte-specific interpretation, reference intervals, and EHR/LIS issues. Its hormone-related interval recommendations have defined scope and do not supply one demographic rule for every analyte.<\/p>\n<p class=\"item\"><strong>Vyas, Eisenstein, and Jones — <a href=\"https://www.nejm.org/doi/full/10.1056/NEJMms2004740\" target=\"_blank\" rel=\"noopener\">Hidden in Plain Sight: Reconsidering the Use of Race Correction in Clinical Algorithms<\/a> (2020).<\/strong> A perspective broadening the discussion of how race enters clinical decision rules. Useful historical framing; individual algorithms and recommendations require current, topic-specific evidence.<\/p>\n<h2>AI data and quality improvement<\/h2>\n<p class=\"item\"><strong>Chang et al. — <a href=\"https://journals.plos.org/globalpublichealth/article?id=10.1371/journal.pgph.0003555\" target=\"_blank\" rel=\"noopener\">Racial differences in laboratory testing as a potential mechanism for bias in AI<\/a> (2024).<\/strong> Links documented testing differences to potential problems with laboratory-dependent AI labels. The study measured testing patterns, rather than harm from a deployed model.<\/p>\n<p class=\"item\"><strong>CDC — <a href=\"https://www.cdc.gov/mmwr/volumes/72/wr/mm7228a2.htm\" target=\"_blank\" rel=\"noopener\">Updated Operational Guidance for Implementing Recommendations on Testing for Hepatitis C Virus Infection<\/a> (2023).<\/strong> A practical laboratory-workflow resource on incomplete testing, single-visit collection, and automatic RNA testing. Supports the QI workflow discussion; subgroup equity effects remain a separate question.<\/p><\/details><p class=\"footer\">Module preview complete. Thank you for considering how testing choices shape opportunities for care.<\/p><\/section><\/main><\/html>"}];let active=0;const visited=new Set([0]);const host=document.querySelector('#frames');const buttons=document.querySelector('#menu');sections.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.label;b.onclick=()=>show(i);buttons.appendChild(b);const f=document.createElement('iframe');f.title=s.label;f.srcdoc=s.html;f.hidden=i!==0;host.appendChild(f);});function show(i){active=i;visited.add(i);[...host.children].forEach((f,n)=>f.hidden=n!==i);[...buttons.children].forEach((b,n)=>b.setAttribute('aria-current',n===i));document.querySelector('#previous').disabled=i===0;document.querySelector('#next').disabled=i===sections.length-1;document.querySelector('#next').textContent=i===0?'Begin module':'Next section';document.querySelector('#position').textContent=sections[i].label;document.querySelector('#visited').textContent=Math.max(0,visited.size-1)+' of '+(sections.length-1)+' sections opened';document.querySelector('#menu').hidden=true;}document.querySelector('#toggle').onclick=()=>{let menu=document.querySelector('#menu');menu.hidden=!menu.hidden;};document.querySelector('#previous').onclick=()=>show(active-1);document.querySelector('#next').onclick=()=>show(active+1);show(0);</script></html>
